name: 순위 수집

on:
  schedule:
    # 매시 7분. 정각은 러너가 몰려 수십 분씩 밀리는 일이 잦다.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "리포트에 담을 기간(시간)"
        default: "720"
      skip_collect:
        description: "수집 없이 리포트만 다시 생성"
        type: boolean
        default: false

permissions:
  contents: write

# 앞 실행이 끝나기 전에 다음 실행이 겹치면 커밋이 충돌한다.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul   # 시간대별 분석이 KST 기준이어야 한다. 러너 기본은 UTC.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집 및 리포트 생성
        run: |
          python -m app.cli \
            --window "${{ github.event.inputs.window || '720' }}" \
            --keep-days 90 \
            --source schedule \
            ${{ github.event.inputs.skip_collect == 'true' && '--skip-collect' || '' }}

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.jsonl docs/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "순위 수집 $(date '+%Y-%m-%d %H:%M') KST"
          # 스케줄 실행이 겹쳐 원격이 앞서 있으면 rebase 후 재시도한다.
          for i in 1 2 3; do
            git push && exit 0
            echo "push 실패 — 원격을 당겨 재시도 ($i/3)"
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          exit 1
