# 실제로 설치되는 버전 잠금 파일. run.bat 이 이 파일을 우선 사용한다.
#
# requirements.txt 는 '무엇에 의존하는가'(직접 의존성 5개)를 읽기 쉽게 남기고,
# 이 파일은 '어떤 버전으로 돌아가는가'를 전이 의존성까지 고정한다. >= 만 쓰면
# 새 PC 에서 만든 가상환경이 그 시점의 최신 버전을 받아 서로 다른 조합이 된다.
#
# 아래 조합은 실제로 검증했다 — 서버 기동 · /api/analytics · /api/report.html ·
# /api/export.xlsx 전부 200, 엑셀 5시트 + 네이티브 차트 4개 정상.
#
# 올리려면:
#   1) requirements.txt 의 하한을 고친다 (의도를 남기는 곳)
#   2) .venv 를 지우고 run.bat 을 돌린다
#   3) .venv\Scripts\python -m pip freeze > requirements.lock
#   4) 화면과 리포트를 확인하고 커밋한다
